version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: rapidq-api
    ports:
      - "5187:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RAPIDQ_DB_PATH=/var/data/QueueManagement.db
      - Jwt__Key=RapidQSuperSecretKeyForJwtTokensDeployment2026!
      - Jwt__Issuer=RapidQApi
      - Jwt__Audience=RapidQClient
    volumes:
      - rapidq-storage:/var/data

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: rapidq-client
    ports:
      - "5267:80"
    depends_on:
      - api

volumes:
  rapidq-storage:
