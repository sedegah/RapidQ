<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RapidQ - Smart Queue Management</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="QueueManagement.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d141b; color: #edf4ff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
            <div style="text-align: center; max-width: 400px; padding: 2rem;">
                <div style="width: 42px; height: 42px; border: 3px solid #2d3d4d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.25rem;"></div>
                <h3 style="margin: 0 0 0.5rem; font-weight: 700; color: #edf4ff; letter-spacing: -0.02em;">RapidQ</h3>
                <p style="margin: 0; color: #a9bbce; font-size: 0.95rem;">Initializing Queue Management System...</p>
            </div>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>

    <div id="blazor-error-ui" style="display: none; background: #c75d5d; color: white; padding: 1rem; position: fixed; bottom: 0; left: 0; right: 0; z-index: 99999; text-align: center;">
        An unhandled error has occurred.
        <a href="" class="reload" style="color: white; font-weight: bold; margin-left: 1rem; text-decoration: underline;">Reload</a>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
